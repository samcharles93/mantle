name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        env:
          GOEXPERIMENT: simd
        run: go build ./...

      - name: Vet
        env:
          GOEXPERIMENT: simd
        run: go vet ./...

      - name: Test
        env:
          GOEXPERIMENT: simd
        run: go test ./...

      - name: golangci-lint
        env:
          GOEXPERIMENT: simd
          PATH: $(go env GOPATH)/bin:$PATH
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run

  test-cuda-tag:
    name: CUDA build tag (compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Vet with cuda tag
        env:
          GOEXPERIMENT: simd
        run: go vet -tags cuda ./internal/... ./cmd/...
